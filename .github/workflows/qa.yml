name: QA

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-qa:
    name: Go QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build QA tools image
        run: ./dev setup
      - name: Run QA gates
        run: ./dev check
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-qa-reports
          path: |
            app/coverage/dev-*/
            !app/coverage/dev-*/build/stack-launcher
          if-no-files-found: ignore
