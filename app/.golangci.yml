version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - noctx
    - nolintlint
    - staticcheck
    - unused
  settings:
    cyclop:
      max-complexity: 7
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: []
    rules:
      - path: _test\.go
        linters: [cyclop]
